<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Hub - Made by Armash</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* Banner Style */
        .banner {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-bottom: 2px solid #38bdf8;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }
        .banner h1 {
            color: #38bdf8;
            font-size: 1.8rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .banner p {
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .whatsapp-btn {
            display: inline-block;
            background-color: #25D366;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: transform 0.2s, background-color 0.2s;
        }
        .whatsapp-btn:hover {
            background-color: #1ebe57;
            transform: scale(1.05);
        }

        /* Main Container */
        .container {
            max-width: 900px;
            width: 95%;
            margin: 25px auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .tab-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
        }

        /* Sections */
        .section {
            display: none;
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .section.active {
            display: block;
        }

        /* Chat Box */
        .chat-box {
            height: 380px;
            overflow-y: auto;
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            padding: 12px 15px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .user-msg {
            background: #0284c7;
            color: white;
            align-self: flex-end;
        }
        .ai-msg {
            background: #334155;
            color: #f8fafc;
            align-self: flex-start;
        }

        /* Input Areas */
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        .action-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background: #7dd3fc;
        }
        .action-btn:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        /* Image Generator */
        .image-result {
            margin-top: 20px;
            text-align: center;
            min-height: 250px;
            background: #0f172a;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .image-result img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .loading-text {
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Banner -->
    <header class="banner">
        <h1>MADE BY ARMASH</h1>
        <p>WEBSITE DEVELOPER</p>
        <a href="https://wa.me/94761029285" target="_blank" class="whatsapp-btn">
            CONTACT ME WHATS App (Wa.me/94761029285)
        </a>
    </header>

    <div class="container">
        <!-- Mode Switcher -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('chat')">📚 AI Study Chat</button>
            <button class="tab-btn" onclick="switchTab('image')">🎨 AI Photo Generator</button>
        </div>

        <!-- Study Chat Section -->
        <div id="chat-section" class="section active">
            <div class="chat-box" id="chat-box">
                <div class="message ai-msg">ආයුබෝවන්! මම ඔයාගේ AI Study Assistant. ඕනෑම පාඩමක්, ප්‍රශ්නයක් මගෙන් අහන්න.</div>
            </div>
            <div class="input-group">
                <input type="text" id="chat-input" placeholder="ඔයාගේ ප්‍රශ්නය මෙතන type කරන්න..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button class="action-btn" id="send-btn" onclick="sendMessage()">Ask AI</button>
            </div>
        </div>

        <!-- Image Generator Section -->
        <div id="image-section" class="section">
            <div class="input-group">
                <input type="text" id="image-input" placeholder="ඔයාට හදාගන්න ඕනේ photo එක විස්තර කරන්න (English වලින්)..." onkeypress="if(event.key === 'Enter') generateImage()">
                <button class="action-btn" id="gen-btn" onclick="generateImage()">Generate</button>
            </div>
            <div class="image-result" id="image-result">
                <span style="color: #64748b;">ඔයා හදන Photos මෙතනින් පෙන්නයි...</span>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            
            if (tab === 'chat') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('chat-section').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('image-section').classList.add('active');
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const chatBox = document.getElementById('chat-box');
            const sendBtn = document.getElementById('send-btn');
            const question = input.value.trim();

            if (!question) return;

            // Add user message
            chatBox.innerHTML += `<div class="message user-msg">${question}</div>`;
            input.value = '';
            sendBtn.disabled = true;
            chatBox.scrollTop = chatBox.scrollHeight;

            // Add loading indicator
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div class="message ai-msg" id="${loadingId}">හිතමින් පවතී... ⏳</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const prompt = `You are a helpful study assistant. Answer clearly: ${question}`;
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                const answer = await response.text();
                
                document.getElementById(loadingId).innerText = answer;
            } catch (error) {
                document.getElementById(loadingId).innerText = "Error: සම්බන්ධතාවයේ දෝෂයක්. නැවත උත්සාහ කරන්න.";
            }

            sendBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function generateImage() {
            const input = document.getElementById('image-input');
            const resultDiv = document.getElementById('image-result');
            const prompt = input.value.trim();

            if (!prompt) return;

            resultDiv.innerHTML = `<span class="loading-text">Photo එක නිර්මාණය වෙමින් පවතී... ⏳</span>`;
            
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?nologo=true&seed=${Math.floor(Math.random() * 10000)}`;
            
            const img = new Image();
            img.src = imageUrl;
            img.onload = function() {
                resultDiv.innerHTML = '';
                resultDiv.appendChild(img);
            };
            img.onerror = function() {
                resultDiv.innerHTML = `<span style="color: #ef4444;">Photo එක සෑදීමට නොහැකි විය. නැවත උත්සාහ කරන්න.</span>`;
            };
        }
    </script>
</body>
</html>
