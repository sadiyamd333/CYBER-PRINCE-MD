  <script>
    async function askAI() {
      const mode = document.getElementById("mode").value;
      const input = document.getElementById("userInput").value.trim();
      const resultBox = document.getElementById("resultBox");
      const loader = document.getElementById("loader");
      const btn = document.getElementById("submitBtn");

      if (!input) {
        alert("Please enter a question or notes! / කරුණාකර ප්‍රශ්නයක් හෝ සටහනක් ඇතුළත් කරන්න!");
        return;
      }

      let systemInstruction = "You are a helpful, brilliant AI study tutor. Detect the language of the user's input automatically and respond in that exact same language. Provide clear, accurate, and structured educational help.";

      let taskPrompt = "";
      if (mode === "explain") {
        taskPrompt = "Explain this clearly and simply: ";
      } else if (mode === "summarize") {
        taskPrompt = "Summarize the following notes into clear, easy-to-remember bullet points: ";
      } else if (mode === "quiz") {
        taskPrompt = "Create 5 multiple-choice questions (MCQs) with correct answers at the bottom based on this topic/text: ";
      } else if (mode === "translate_simple") {
        taskPrompt = "Explain this topic in very simple terms using the same language: ";
      }

      loader.style.display = "block";
      resultBox.style.display = "none";
      btn.disabled = true;

      try {
        const response = await fetch('/.netlify/functions/generate', {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: systemInstruction + "\n\nTask: " + taskPrompt + input
          })
        });

        const data = await response.json();
        
        if (response.ok && data.reply) {
          resultBox.innerText = data.reply;
          resultBox.style.display = "block";
        } else {
          // Me thanadi server eken enna exact error eka screen eke pennai
          resultBox.innerText = "Server Error Details: " + (data.error || JSON.stringify(data));
          resultBox.style.display = "block";
        }
      } catch (error) {
        resultBox.innerText = "Network error: " + error.message;
        resultBox.style.display = "block";
      } finally {
        loader.style.display = "none";
        btn.disabled = false;
      }
    }
  </script>
