<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Hub - Armash, Aliy & HAshh</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* Stylish Banner Style */
        .banner {
            background: linear-gradient(135deg, #090d16, #1e293b, #0f172a);
            border-bottom: 3px solid #38bdf8;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.3);
            position: relative;
            overflow: hidden;
        }
        .banner h1 {
            color: #38bdf8;
            font-size: 2rem;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        .banner .creators {
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(45deg, #f43f5e, #38bdf8, #a855f7, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
            filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.4));
            animation: glow 3s ease-in-out infinite alternate;
        }
        @keyframes glow {
            0% { filter: drop-shadow(0 0 5px rgba(244, 63, 94, 0.4)); }
            100% { filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.8)); }
        }
        .banner p {
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .whatsapp-btn {
            display: inline-block;
            background: linear-gradient(135deg, #25D366, #1ebe57);
            color: #ffffff;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .whatsapp-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        /* Main Container */
        .container {
            max-width: 900px;
            width: 95%;
            margin: 25px auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .tab-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        /* Sections */
        .section {
            display: none;
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .section.active {
            display: block;
        }

        /* Chat Box */
        .chat-box {
            height: 380px;
            overflow-y: auto;
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #1e293b;
        }
        .message {
            padding: 12px 15px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .user-msg {
            background: #0284c7;
            color: white;
            align-self: flex-end;
        }
        .ai-msg {
            background: #334155;
            color: #f8fafc;
            align-self: flex-start;
        }

        /* Input Areas */
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }
        .action-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .action-btn:hover {
            background: #7dd3fc;
        }
        .action-btn:active {
            transform: scale(0.95);
        }
        .action-btn:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        /* Image Generator */
        .image-result {
            margin-top: 20px;
            text-align: center;
            min-height: 250px;
            background: #0f172a;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            gap: 10px;
            border: 1px solid #1e293b;
        }
        .image-result img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .loading-text {
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Stylish Banner -->
    <header class="banner">
        <h1>MADE BY ARMASH</h1>
        <div class="creators">⚡ ALIY & HAshh ⚡</div>
        <p>WEBSITE DEVELOPER</p>
        <a href="https://wa.me/94761029285" target="_blank" class="whatsapp-btn">
            💬 CONTACT ME WHATSApp
        </a>
    </header>

    <div class="container">
        <!-- Mode Switcher -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('chat')">📚 Instant AI Study Chat</button>
            <button class="tab-btn" onclick="switchTab('image')">🎨 Instant AI Photo Generator</button>
        </div>

        <!-- Study Chat Section -->
        <div id="chat-section" class="section active">
            <div class="chat-box" id="chat-box">
                <div class="message ai-msg">ආයුබෝවන්! Hello! வணக்கம்! 
Armash, Aliy සහ HAshh විසින් නිර්මාණය කරන ලද මෙම Fast AI Hub එකෙන් ඔබට කිසිදු ප්‍රමාදයකින් තොරව ඉක්මනින් පිළිතුරු ලබාගත හැක.</div>
            </div>
            <div class="input-group">
                <input type="text" id="chat-input" placeholder="ඉක්මනින් ප්‍රශ්නයක් අහන්න..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button class="action-btn" id="send-btn" onclick="sendMessage()">Ask AI</button>
            </div>
        </div>

        <!-- Image Generator Section -->
        <div id="image-section" class="section">
            <div class="input-group">
                <input type="text" id="image-input" placeholder="අවශ්‍ය photo එක විස්තර කරන්න..." onkeypress="if(event.key === 'Enter') generateImage()">
                <button class="action-btn" id="gen-btn" onclick="generateImage()">Generate</button>
            </div>
            <div class="image-result" id="image-result">
                <span style="color: #64748b;">ඡායාරූපය මෙතනින් පෙන්නයි...</span>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            
            if (tab === 'chat') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('chat-section').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('image-section').classList.add('active');
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const chatBox = document.getElementById('chat-box');
            const sendBtn = document.getElementById('send-btn');
            const question = input.value.trim();

            if (!question) return;

            chatBox.innerHTML += `<div class="message user-msg">${question}</div>`;
            input.value = '';
            sendBtn.disabled = true;
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div class="message ai-msg" id="${loadingId}">විමසමින් පවතී... ⚡</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Using a high-speed public chat API endpoint to prevent delays and rate limits
                const apiURL = `https://kaiz-apis.gleeze.com/api/gpt4o?q=${encodeURIComponent(question)}`;
                const response = await fetch(apiURL);
                const data = await response.json();
                
                let answer = "";
                if (data && (data.response || data.result || data.answer)) {
                    answer = data.response || data.result || data.answer;
                } else if (typeof data === 'string') {
                    answer = data;
                } else {
                    answer = JSON.stringify(data);
                }

                document.getElementById(loadingId).innerText = answer;
            } catch (error) {
                // Fallback instant API if primary is busy
                try {
                    const fallbackURL = `https://hercai.onrender.com/gemini/v2?prompt=${encodeURIComponent(question)}`;
                    const fbRes = await fetch(fallbackURL);
                    const fbData = await fbRes.json();
                    document.getElementById(loadingId).innerText = fbData.reply || "සම්බන්ධතාවයේ දෝෂයක්. නැවත උත්සාහ කරන්න.";
                } catch (err) {
                    document.getElementById(loadingId).innerText = "කරුණාකර තත්පර කිහිපයකින් නැවත උත්සාහ කරන්න.";
                }
            }

            sendBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function generateImage() {
            const input = document.getElementById('image-input');
            const resultDiv = document.getElementById('image-result');
            const genBtn = document.getElementById('gen-btn');
            const userPrompt = input.value.trim();

            if (!userPrompt) return;

            genBtn.disabled = true;
            resultDiv.innerHTML = `<span class="loading-text">ඉක්මනින් නිර්මාණය වෙමින් පවතී... ⚡</span>`;
            
            try {
                // Direct high-speed image generation URL
                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(userPrompt)}?nologo=true&seed=${Math.floor(Math.random() * 999999)}&width=1024&height=1024`;
                
                const img = new Image();
                img.src = imageUrl;
                img.onload = function() {
                    resultDiv.innerHTML = '';
                    resultDiv.appendChild(img);
                    genBtn.disabled = false;
                };
                img.onerror = function() {
                    resultDiv.innerHTML = `<span style="color: #ef4444;">ඡායාරූපය සෑදීමට නොහැකි විය. නැවත උත්සාහ කරන්න.</span>`;
                    genBtn.disabled = false;
                };
            } catch (error) {
                resultDiv.innerHTML = `<span style="color: #ef4444;">දෝෂයක් ඇති විය. නැවත උත්සාහ කරන්න.</span>`;
                genBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
