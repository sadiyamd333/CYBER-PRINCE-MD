
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Study Helper - Smart Learning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .container { width: 100%; max-width: 700px; background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 5px; font-size: 1.8rem; }
    p.subtitle { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
    
    /* Ad Space */
    .ad-box { background: #0f172a; border: 1px dashed #475569; color: #64748b; text-align: center; padding: 15px; margin: 15px 0; border-radius: 8px; font-size: 0.85rem; }

    label { display: block; margin-bottom: 8px; font-weight: 600; color: #cbd5e1; font-size: 0.9rem; }
    select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; margin-bottom: 15px; font-size: 1rem; outline: none; }
    select:focus, textarea:focus { border-color: #38bdf8; }
    textarea { resize: vertical; min-height: 120px; }

    button { width: 100%; padding: 14px; background: linear-gradient(135deg, #0284c7, #2563eb); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:disabled { background: #475569; cursor: not-allowed; }

    .result-box { margin-top: 20px; background: #0f172a; padding: 18px; border-radius: 10px; border: 1px solid #334155; display: none; white-space: pre-wrap; line-height: 1.6; font-size: 0.95rem; }
    .loader { text-align: center; display: none; margin-top: 15px; color: #38bdf8; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎓 AI Study Helper</h1>
    <p class="subtitle">Onaama padamak lesiyen igena ganna (Sinhala & English)</p>

    <!-- Top Ad Banner -->
    <div class="ad-box">
      [ Adsterra / AdSense Banner Code Methanata Danna ]
    </div>

    <label for="mode">Mokakda karanna one?</label>
    <select id="mode">
      <option value="explain">Prashnayak ahanna / Padamak therum ganna</option>
      <option value="summarize">Diga note ekak ketiyen saralawa hadanna (Summarize)</option>
      <option value="quiz">MCQ Prashna 5k hadanna (Quiz)</option>
      <option value="sinhala">Sinhala theruma saha pahadili kirima ganna</option>
    </select>

    <label for="userInput">Oyage prashnaya ho note eka methanata danna:</label>
    <textarea id="userInput" placeholder="Udaharana: Photosynthesis kiyanne mokakda? / Me note eka summarize karanna..."></textarea>

    <button id="submitBtn" onclick="askAI()">✨ Generate Answer</button>

    <div class="loader" id="loader">⏳ AI hithanawa... Poddak inna...</div>
    <div class="result-box" id="resultBox"></div>

    <!-- Bottom Ad Banner -->
    <div class="ad-box">
      [ Adsterra / AdSense Bottom Ad Code Methanata Danna ]
    </div>
  </div>

  <script>
    // Methanata oyage Gemini API Key eka danna
    const API_KEY = "YOUR_GEMINI_API_KEY"; 

    async function askAI() {
      const mode = document.getElementById("mode").value;
      const input = document.getElementById("userInput").value.trim();
      const resultBox = document.getElementById("resultBox");
      const loader = document.getElementById("loader");
      const btn = document.getElementById("submitBtn");

      if (!input) {
        alert("Karunakara prashnayak ho note ekak type karanna!");
        return;
      }

      if (API_KEY === "YOUR_GEMINI_API_KEY") {
        alert("Code eke 'YOUR_GEMINI_API_KEY' thanata oyage API key eka danna!");
        return;
      }

      let promptPrefix = "";
      if (mode === "explain") {
        promptPrefix = "You are a helpful Sri Lankan study tutor. Explain this clearly and simply for a student (in the same language the user asked, or Sinhala/English as appropriate): ";
      } else if (mode === "summarize") {
        promptPrefix = "Summarize the following study notes into clear, easy-to-remember bullet points: ";
      } else if (mode === "quiz") {
        promptPrefix = "Create 5 multiple-choice questions (MCQs) with answers at the bottom based on this topic/text: ";
      } else if (mode === "sinhala") {
        promptPrefix = "Explain this topic in simple, clear Sinhala for a student: ";
      }

      loader.style.display = "block";
      resultBox.style.display = "none";
      btn.disabled = true;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptPrefix + input }] }]
          })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          resultBox.innerText = data.candidates[0].content.parts[0].text;
          resultBox.style.display = "block";
        } else {
          resultBox.innerText = "Error: Uththarayak ganna bari una. API Key eka check karanna.";
          resultBox.style.display = "block";
        }
      } catch (error) {
        resultBox.innerText = "Network error ekak! Internet connection eka check karanna.";
        resultBox.style.display = "block";
      } finally {
        loader.style.display = "none";
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
